services:
  scheduler:
    build: .
    image: workshop-scheduler:latest
    ports:
      - "8000:8000"
    environment:
      WORKSHOP_DB_PATH: /data/workshop.db
      WORKSHOP_SOLVER_TIME_LIMIT_S: "10"
    volumes:
      - workshop-data:/data
    restart: unless-stopped

volumes:
  workshop-data:
