<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheet-Metal Workshop Scheduler</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Sheet-Metal Workshop Scheduler</h1>
    <div class="controls">
      <label>Size
        <select id="size">
          <option value="small" selected>small</option>
          <option value="medium">medium</option>
          <option value="large">large</option>
        </select>
      </label>
      <label>Seed <input id="seed" type="number" value="42" /></label>
      <button id="btn-simulate">Simulate</button>
      <button id="btn-solve" disabled>Solve</button>
      <span id="status" class="status"></span>
    </div>
  </header>

  <section id="kpis" class="kpis"></section>

  <main>
    <div class="gantt-wrap">
      <h2>Schedule (Gantt)</h2>
      <div id="gantt" class="gantt"></div>
    </div>
    <aside class="alerts-wrap">
      <h2>Alerts</h2>
      <ul id="alerts" class="alerts"></ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
